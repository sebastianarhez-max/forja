spring.application.name=forja-api
server.port=${PORT:8080}

# Conexion PostgreSQL (Render o local). En Eclipse puedes definirlas en
# Run Configurations > Environment, o reemplazar aqui los valores por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gimnasio_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima

# JWT (HS256 exige una clave de al menos 32 caracteres)
jwt.secret=${JWT_SECRET:forja-clave-local-de-desarrollo-cambiar-en-produccion-2026}
jwt.expiration=36000
